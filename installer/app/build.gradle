plugins {
    id "com.android.application"
}

android {
    namespace "com.marco.robloxapkm"
    compileSdk 36

    defaultConfig {
        applicationId "com.marco.robloxapkm"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
